name: Build PushSpendTracker APK

on:
  push:
    branches:
      - pushspendtracker-build
    paths:
      - pst_chunks/**
      - .github/workflows/build-pushspendtracker.yml
  pull_request:
    branches:
      - main
    paths:
      - pst_chunks/**
      - .github/workflows/build-pushspendtracker.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild and unpack project
        run: |
          cat pst_chunks/chunk_*.txt | tr -d '\n\r ' | base64 -d > PushSpendTracker_MVP.zip
          unzip -t PushSpendTracker_MVP.zip
          rm -rf build-src
          mkdir build-src
          unzip -q PushSpendTracker_MVP.zip -d build-src
          test -f build-src/PushSpendTracker/settings.gradle

      - name: Apply compiler fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-src/PushSpendTracker/app/src/main/java/com/local/pushspendtracker/notification/BankNotificationListener.java')
          s = p.read_text()
          s = s.replace('        if (bank == null) return;\n        // Never store authentication/OTP content', '        if (bank == null) return;\n        final String resolvedBank = bank;\n        // Never store authentication/OTP content')
          s = s.replace('db.insertUnparsed(postedAt, bank, pkg, title, text,', 'db.insertUnparsed(postedAt, resolvedBank, pkg, title, text,')
          s = s.replace('            t.bank = bank;\n', '            t.bank = resolvedBank;\n')
          p.write_text(s)
          assert 'final String resolvedBank = bank;' in s
          PY

      - name: Unit tests
        working-directory: build-src/PushSpendTracker
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: build-src/PushSpendTracker
        run: gradle assembleDebug --stacktrace

      - name: Show APK
        run: |
          find build-src/PushSpendTracker/app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushSpendTracker-debug-apk
          path: build-src/PushSpendTracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
