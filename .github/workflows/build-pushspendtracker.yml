name: Build PushSpendTracker APK

on:
  push:
    branches:
      - pushspendtracker-build
    paths:
      - pst_chunks/**
      - .github/workflows/build-pushspendtracker.yml
  pull_request:
    branches:
      - main
    paths:
      - pst_chunks/**
      - .github/workflows/build-pushspendtracker.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild and unpack project
        run: |
          cat pst_chunks/chunk_*.txt | tr -d '\n\r ' | base64 -d > PushSpendTracker_MVP.zip
          unzip -t PushSpendTracker_MVP.zip
          rm -rf build-src
          mkdir build-src
          unzip -q PushSpendTracker_MVP.zip -d build-src
          test -f build-src/PushSpendTracker/settings.gradle

      - name: Apply compiler and MIUI compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          listener = Path('build-src/PushSpendTracker/app/src/main/java/com/local/pushspendtracker/notification/BankNotificationListener.java')
          s = listener.read_text()
          if 'final String resolvedBank = bank;' not in s:
              s = s.replace('        if (bank == null) return;\n        // Never store authentication/OTP content', '        if (bank == null) return;\n        final String resolvedBank = bank;\n        // Never store authentication/OTP content')
              s = s.replace('db.insertUnparsed(postedAt, bank, pkg, title, text,', 'db.insertUnparsed(postedAt, resolvedBank, pkg, title, text,')
              s = s.replace('            t.bank = bank;\n', '            t.bank = resolvedBank;\n')
          listener.write_text(s)
          assert 'final String resolvedBank = bank;' in s

          gradle = Path('build-src/PushSpendTracker/app/build.gradle')
          g = gradle.read_text()
          g = g.replace('minSdk 26', 'minSdk 21')
          g = g.replace('targetSdk 35', 'targetSdk 31')
          gradle.write_text(g)
          assert 'minSdk 21' in g and 'targetSdk 31' in g

          manifest = Path('build-src/PushSpendTracker/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          m = m.replace('android:name=".notification.BankNotificationListener"\n            android:exported="false"', 'android:name=".notification.BankNotificationListener"\n            android:exported="true"')
          manifest.write_text(m)
          assert 'android:name=".notification.BankNotificationListener"\n            android:exported="true"' in m
          PY

      - name: Unit tests
        working-directory: build-src/PushSpendTracker
        run: gradle testDebugUnitTest --stacktrace

      - name: Build compatibility APK
        working-directory: build-src/PushSpendTracker
        run: gradle assembleDebug --stacktrace

      - name: Verify APK and V1 signature
        run: |
          APK=build-src/PushSpendTracker/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -E 'META-INF/.*\.(RSA|DSA|EC)$'
          jarsigner -verify "$APK"
          sha256sum "$APK"
          cp "$APK" PushSpendTracker-MIUI-Android12.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushSpendTracker-MIUI-Android12
          path: PushSpendTracker-MIUI-Android12.apk
          if-no-files-found: error
          retention-days: 30
