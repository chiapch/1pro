name: Build PushSpendTracker APK

on:
  push:
    branches:
      - pushspendtracker-build
    paths:
      - pushspendtracker_source.zip
      - .github/workflows/build-pushspendtracker.yml
  pull_request:
    branches:
      - main
    paths:
      - pushspendtracker_source.zip
      - .github/workflows/build-pushspendtracker.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q pushspendtracker_source.zip -d build-src
          test -f build-src/PushSpendTracker/settings.gradle

      - name: Unit tests
        working-directory: build-src/PushSpendTracker
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: build-src/PushSpendTracker
        run: gradle assembleDebug --stacktrace

      - name: Show APK
        run: |
          find build-src/PushSpendTracker/app/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PushSpendTracker-debug-apk
          path: build-src/PushSpendTracker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
